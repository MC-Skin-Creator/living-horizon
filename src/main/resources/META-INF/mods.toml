modLoader = "javafml"
loaderVersion = "[1,)"
license = "GPL-3.0-only"
issueTrackerURL = "https://github.com/MC-Skin-Creator/living-horizon/issues"
# Nothing of the mod runs on a server, and a server does not need it to let a player in.
clientSideOnly = true

[[mods]]
modId = "${id}"
version = "${version}"
displayName = "${name}"
description = "Gives life to the distance: animals, villagers, birds and other players keep living on the horizon, past the render distance."
authors = "clixmods"
displayURL = "https://github.com/MC-Skin-Creator/living-horizon"
logoFile = "assets/livinghorizon/icon.png"

[[dependencies.${id}]]
modId = "forge"
mandatory = true
versionRange = "${forge}"
ordering = "NONE"
side = "CLIENT"

[[dependencies.${id}]]
modId = "minecraft"
mandatory = true
versionRange = "${minecraft}"
ordering = "NONE"
side = "CLIENT"

[[dependencies.${id}]]
modId = "voxy"
mandatory = false
versionRange = "[0,)"
ordering = "NONE"
side = "CLIENT"

[[dependencies.${id}]]
modId = "distanthorizons"
mandatory = false
versionRange = "[0,)"
ordering = "NONE"
side = "CLIENT"
