modLoader = "javafml"
loaderVersion = "[1,)"
license = "LicenseRef-LivingHorizon"
issueTrackerURL = "https://github.com/MC-Skin-Creator/living-horizon/issues"

[[mods]]
modId = "${id}"
version = "${version}"
displayName = "${name}"
description = "Gives life to the distance: animals, villagers and other players stay visible far past your render distance, players who logged off live on where they left, and birds fill the sky. Works with the game alone or on top of Voxy and Distant Horizons."
authors = "clixmods"
credits = "Testers: ISessen"
displayURL = "https://github.com/MC-Skin-Creator/living-horizon"
logoFile = "assets/livinghorizon/icon.png"

[[dependencies.${id}]]
modId = "forge"
mandatory = true
versionRange = "${forge}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${id}]]
modId = "minecraft"
mandatory = true
versionRange = "${minecraft}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${id}]]
modId = "voxy"
mandatory = false
versionRange = "[0,)"
ordering = "NONE"
side = "CLIENT"

[[dependencies.${id}]]
modId = "distanthorizons"
mandatory = false
versionRange = "[0,)"
ordering = "NONE"
side = "CLIENT"
