name: build

# Only pull requests trigger it: main is built by the release workflow on the same
# commit, and a push trigger as well would run every commit twice once a PR is open.
# Closing is listened to as well: merging a feature/ or fix/ branch cancels its build
# still running, which the merge made pointless (the release does not wait for it and
# builds again). Every job skips on that event.
on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

# Compiles and tests every Minecraft target and attaches the jar as a
# short-lived workflow artifact, so a PR can be test-installed before it merges.
# These are not releases: no tag, no GitHub release, no version bump.
#
# A pull request that changes only Markdown files and the LICENSE builds nothing: the
# targets are skipped, and the changelog is still checked. These are the files the
# release ignores too (its paths-ignore); a trigger filter would skip the changelog check.
#
# A pull request into develop or main stamps the version its merge will release, and
# once every target is built leaves a marker naming the merged files and that version.
# The release workflow finds it and publishes these jars rather than building again,
# provided the pushed commit holds exactly the files built here.
permissions:
  contents: read

# A newer push to the same branch or PR makes the run in progress obsolete, and so does
# merging a feature/ or fix/ branch. Any other close (develop into main, a PR closed
# unmerged) takes a group of its own, so that it cancels nothing.
concurrency:
  group: >-
    ${{ github.event.action == 'closed'
    && !(github.event.pull_request.merged
    && (startsWith(github.head_ref, 'feature/') || startsWith(github.head_ref, 'fix/')))
    && format('{0}-closed-{1}', github.workflow, github.run_id)
    || format('{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: true

jobs:
  # Entries go under Unreleased only, with the headings the release reads, the same in
  # English and French: the release dates that section and posts it on Modrinth,
  # CurseForge and Discord.
  changelog:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check the changelog
        run: node .github/scripts/changelog-check.js "origin/${{ github.base_ref }}"

  # The version the merge releases, worked out once on the merge GitHub prepared, with
  # the same script as the release. Empty off develop and main, and when the merge
  # releases nothing: the jars then keep the version in the file.
  version:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tree: ${{ steps.version.outputs.tree }}
      code: ${{ steps.changes.outputs.code }}

    steps:
      - name: Checkout
        # Full history and tags, as the release reads them.
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Work out the version
        id: version
        env:
          BASE: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          version=''
          case "$BASE" in
            develop|main) version=$(.github/scripts/release-version.sh "$BASE") ;;
          esac
          echo "Version: ${version:-unchanged}"
          {
            echo "version=${version}"
            echo "tree=$(git rev-parse 'HEAD^{tree}')"
          } >> "$GITHUB_OUTPUT"

      - name: Look for anything but documentation
        # What the merge GitHub prepared changes on the base: HEAD^1 is the base, HEAD^2
        # the pull request. Anything this cannot read builds, as an odd path does
        # (git quotes it, so it no longer ends in .md).
        id: changes
        run: |
          set -euo pipefail
          code=true
          if git rev-parse -q --verify 'HEAD^2' >/dev/null && files=$(git diff --name-only 'HEAD^1' HEAD); then
            code=false
            while IFS= read -r file; do
              case "$file" in
                '' | *.md | LICENSE) ;;
                *) code=true; break ;;
              esac
            done <<< "$files"
          fi
          echo "Code changed: ${code}"
          if [ "$code" = false ]; then
            echo 'Only documentation changed: no target is built.' >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "code=${code}" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    if: github.event.action != 'closed' && needs.version.outputs.code == 'true'
    # One job per Stonecutter target, so a version that stops compiling fails on its
    # own line. A target added to stonecutter.properties.toml is added here too.
    strategy:
      fail-fast: false
      matrix:
        minecraft:
          - '1.20.1'
          - '1.20.2'
          - '1.20.4'
          - '1.20.6'
          - '1.21.1'
          - '1.21.3'
          - '1.21.4'
          - '1.21.5'
          - '1.21.8'
          - '1.21.10'
          - '1.21.11'
          - '26.1.x'
          - '26.2.x'
          - '26.3.x'
          # The same game versions on the other loaders: the same sources, another build script.
          - '1.20.6-neoforge'
          - '1.21.1-neoforge'
          - '1.21.3-neoforge'
          - '1.21.4-neoforge'
          - '1.21.5-neoforge'
          - '1.21.8-neoforge'
          - '1.21.10-neoforge'
          - '1.21.11-neoforge'
          - '26.1.x-neoforge'
          - '26.2.x-neoforge'
          - '26.3.x-neoforge'
          - '1.20.1-quilt'
          - '1.20.2-quilt'
          - '1.20.4-quilt'
          - '1.20.6-quilt'
          - '1.21.1-quilt'
          - '1.21.3-quilt'
          - '1.21.4-quilt'
          - '1.21.5-quilt'
          - '1.21.8-quilt'
          - '1.21.10-quilt'
          - '1.21.11-quilt'
          - '26.1.x-quilt'
          - '26.2.x-quilt'
          - '26.3.x-quilt'
          - '1.20.1-forge'
          - '1.20.2-forge'
          - '1.20.4-forge'
          - '1.20.6-forge'
          - '1.21.1-forge'
          - '1.21.3-forge'
          - '1.21.4-forge'
          - '1.21.5-forge'
          - '1.21.8-forge'
          - '1.21.10-forge'
          - '1.21.11-forge'
          - '26.1.x-forge'
          - '26.2.x-forge'
          - '26.3.x-forge'

    name: build ${{ matrix.minecraft }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore the Gradle cache
        # Read only: the cache workflow writes it on develop, where every pull request
        # into develop can read it.
        uses: ./.github/actions/gradle-cache
        with:
          node: ${{ matrix.minecraft }}

      - name: Stamp the version
        # The number the release will give these jars, so it can publish them as they are.
        if: needs.version.outputs.version != ''
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          sed -i "s/^mod\.version = .*/mod.version = \"${VERSION}\"/" stonecutter.properties.toml
          grep '^mod.version' stonecutter.properties.toml

      - name: Set up JDKs
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          # Minecraft up to 1.20.4 runs on Java 17, then Java 21, and 26.x on Java 25.
          # The last entry becomes JAVA_HOME and so runs Gradle itself, which needs 21:
          # Loom and the build plugins do not run on 17.
          java-version: |
            25
            17
            21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # Its cache saved some 4 GB per job, which only that pull request could read
          # again: the step above replaces it.
          cache-disabled: true

      - name: Build
        # build compiles and runs the tests; buildAndCollect copies the jar into
        # build/libs/<mod version>/, which is what gets uploaded.
        # --configure-on-demand configures this one target and the root alone.
        run: >-
          ./gradlew ":${{ matrix.minecraft }}:build" ":${{ matrix.minecraft }}:buildAndCollect"
          --stacktrace --configure-on-demand
          -Porg.gradle.java.installations.fromEnv=JAVA_HOME_17_X64,JAVA_HOME_21_X64,JAVA_HOME_25_X64

      - name: Upload test report
        # Only worth having when something failed, and then it is the first thing
        # anyone opens.
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-${{ matrix.minecraft }}
          path: versions/${{ matrix.minecraft }}/build/reports/tests/test
          retention-days: 7

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: livinghorizon-${{ matrix.minecraft }}
          path: build/libs/*/*
          if-no-files-found: error
          # A preview build, kept long enough for the release to take it once the pull
          # request merges; past that, the release builds again.
          retention-days: 14

  # Only once every target built: the marker tells the release that this run holds the
  # jars of every target for these files (the merge's tree) at this version. Skipped with
  # the build when only documentation changed: the release skips such a push as well.
  prebuilt:
    needs: [version, build]
    if: needs.version.outputs.version != ''
    runs-on: ubuntu-latest

    steps:
      - name: Write the marker
        env:
          VERSION: ${{ needs.version.outputs.version }}
          TREE: ${{ needs.version.outputs.tree }}
        run: printf 'version=%s\ntree=%s\n' "$VERSION" "$TREE" > prebuilt.txt

      - name: Leave the marker
        uses: actions/upload-artifact@v4
        with:
          name: prebuilt-${{ needs.version.outputs.tree }}-${{ needs.version.outputs.version }}
          path: prebuilt.txt
          retention-days: 14
