name: build

# Only pull requests trigger it: main is built by the release workflow on the same
# commit, and a push trigger as well would run every commit twice once a PR is open.
on:
  pull_request:

# Compiles and tests every Minecraft target and attaches the jar and the data pack as a
# short-lived workflow artifact, so a PR can be test-installed before it merges.
# These are not releases: no tag, no GitHub release, no version bump.
permissions:
  contents: read

# A newer push to the same branch or PR makes the run in progress obsolete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # One job per Stonecutter target, so a version that stops compiling fails on its
    # own line. A target added to stonecutter.properties.toml is added here too.
    strategy:
      fail-fast: false
      matrix:
        minecraft:
          - '1.20.1'
          - '1.20.2'
          - '1.20.4'
          - '1.20.6'
          - '1.21.1'
          - '1.21.3'
          - '1.21.4'
          - '1.21.5'
          - '1.21.8'
          - '1.21.10'
          - '1.21.11'
          - '26.1.x'
          - '26.2.x'
          - '26.3.x'
          # The same game versions on the other loaders: the same sources, another build script.
          - '1.20.6-neoforge'
          - '1.21.1-neoforge'
          - '1.21.3-neoforge'
          - '1.21.4-neoforge'
          - '1.21.5-neoforge'
          - '1.21.8-neoforge'
          - '1.21.10-neoforge'
          - '1.21.11-neoforge'
          - '26.1.x-neoforge'
          - '26.2.x-neoforge'
          - '26.3.x-neoforge'
          - '1.20.1-quilt'
          - '1.20.2-quilt'
          - '1.20.4-quilt'
          - '1.20.6-quilt'
          - '1.21.1-quilt'
          - '1.21.3-quilt'
          - '1.21.4-quilt'
          - '1.21.5-quilt'
          - '1.21.8-quilt'
          - '1.21.10-quilt'
          - '1.21.11-quilt'
          - '26.1.x-quilt'
          - '26.2.x-quilt'
          - '26.3.x-quilt'
          - '1.20.1-forge'
          - '1.20.2-forge'
          - '1.20.4-forge'
          - '1.20.6-forge'
          - '1.21.1-forge'
          - '1.21.3-forge'
          - '1.21.4-forge'
          - '1.21.5-forge'
          - '1.21.8-forge'
          - '1.21.10-forge'
          - '1.21.11-forge'
          - '26.1.x-forge'
          - '26.2.x-forge'
          - '26.3.x-forge'

    name: build ${{ matrix.minecraft }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDKs
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          # Minecraft up to 1.20.4 runs on Java 17, then Java 21, and 26.x on Java 25.
          # The last entry becomes JAVA_HOME and so runs Gradle itself, which needs 21:
          # Loom and the build plugins do not run on 17.
          java-version: |
            25
            17
            21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # Read-only is the default off the default branch, which would mean the
          # cache is never written on a pull request.
          cache-read-only: false
          cache-cleanup: always

      - name: Build
        # build compiles and runs the tests; buildAndCollect copies the jar and zips
        # the data pack into build/libs/<mod version>/, which is what gets uploaded.
        # --configure-on-demand configures this one target and the root alone.
        run: >-
          ./gradlew ":${{ matrix.minecraft }}:build" ":${{ matrix.minecraft }}:buildAndCollect"
          --stacktrace --configure-on-demand
          -Porg.gradle.java.installations.fromEnv=JAVA_HOME_17_X64,JAVA_HOME_21_X64,JAVA_HOME_25_X64

      - name: Upload test report
        # Only worth having when something failed, and then it is the first thing
        # anyone opens.
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-${{ matrix.minecraft }}
          path: versions/${{ matrix.minecraft }}/build/reports/tests/test
          retention-days: 7

      - name: Upload jar and data pack
        uses: actions/upload-artifact@v4
        with:
          name: livinghorizon-${{ matrix.minecraft }}
          path: build/libs/*/*
          # A preview build, not a release: no need to keep it around.
          retention-days: 7
