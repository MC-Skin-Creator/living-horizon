name: build

# Only pull requests trigger it: main is built by the release workflow on the same
# commit, and a push trigger as well would run every commit twice once a PR is open.
on:
  pull_request:

# Compiles and tests every Minecraft target and attaches the jar and the data pack as a
# short-lived workflow artifact, so a PR can be test-installed before it merges.
# These are not releases: no tag, no GitHub release, no version bump.
permissions:
  contents: read

# A newer push to the same branch or PR makes the run in progress obsolete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # One job per Stonecutter target, so a version that stops compiling fails on its
    # own line. A target added to stonecutter.properties.toml is added here too.
    strategy:
      fail-fast: false
      matrix:
        minecraft:
          - '1.21.11'

    name: build ${{ matrix.minecraft }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDKs
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          # Minecraft 1.21.x runs on Java 21, 26.x on Java 25. The last entry becomes
          # JAVA_HOME and so runs Gradle itself.
          java-version: |
            25
            21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # Read-only is the default off the default branch, which would mean the
          # cache is never written on a pull request.
          cache-read-only: false
          cache-cleanup: always

      - name: Build
        # build compiles and runs the tests; buildAndCollect copies the jar and zips
        # the data pack into build/libs/<mod version>/, which is what gets uploaded.
        # --configure-on-demand configures this one target and the root alone.
        run: >-
          ./gradlew ":${{ matrix.minecraft }}:build" ":${{ matrix.minecraft }}:buildAndCollect"
          --stacktrace --configure-on-demand
          -Porg.gradle.java.installations.fromEnv=JAVA_HOME_21_X64,JAVA_HOME_25_X64

      - name: Upload test report
        # Only worth having when something failed, and then it is the first thing
        # anyone opens.
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-${{ matrix.minecraft }}
          path: versions/${{ matrix.minecraft }}/build/reports/tests/test
          retention-days: 7

      - name: Upload jar and data pack
        uses: actions/upload-artifact@v4
        with:
          name: livinghorizon-${{ matrix.minecraft }}
          path: build/libs/*/*
          # A preview build, not a release: no need to keep it around.
          retention-days: 7
