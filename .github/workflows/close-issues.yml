name: close issues

# GitHub closes the issues a pull request names ("Closes #12") only when it is merged
# into the default branch, main. Pull requests go to develop, so this closes them at that
# merge instead, and ticks their "- [ ]" line in every open issue that lists them (a plan
# such as #157). The keywords are read from the description and the commit messages.
# pull_request_target, so that a pull request from a fork gets a token that may close
# issues; nothing from the pull request's branch is checked out or run.
on:
  pull_request_target:
    types: [closed]
    branches: [develop]

permissions:
  issues: write
  pull-requests: read

jobs:
  close:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Close the issues the pull request resolves
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const pr = context.payload.pull_request;

            const commits = await github.paginate(github.rest.pulls.listCommits, {
              owner, repo, pull_number: pr.number, per_page: 100,
            });
            const texts = [pr.body || '', ...commits.map(c => c.commit.message)];

            // GitHub's own closing keywords, followed by #N or this repository's issue URL.
            const keyword = new RegExp(
              '\\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\\s*:?\\s+' +
              `(?:#|https://github\\.com/${owner}/${repo}/issues/)(\\d+)\\b`, 'gi');
            const numbers = new Set();
            for (const text of texts) {
              for (const match of text.matchAll(keyword)) numbers.add(Number(match[1]));
            }
            if (numbers.size === 0) {
              core.info('No issue named with a closing keyword.');
              return;
            }

            const open = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', per_page: 100,
            });

            for (const number of numbers) {
              let issue;
              try {
                issue = (await github.rest.issues.get({ owner, repo, issue_number: number })).data;
              } catch (error) {
                core.warning(`#${number}: ${error.message}`);
                continue;
              }
              if (issue.pull_request) continue;
              if (issue.state === 'open') {
                await github.rest.issues.createComment({
                  owner, repo, issue_number: number,
                  body: `Resolved by #${pr.number}, merged into \`develop\`: it comes with the next release.`,
                });
                await github.rest.issues.update({
                  owner, repo, issue_number: number, state: 'closed', state_reason: 'completed',
                });
                core.info(`Closed #${number}.`);
              }

              // Tick the line that names it in every open issue's task list.
              const line = new RegExp(`^(\\s*[-*+] )\\[ \\](?=.*#${number}(?!\\d))`, 'gm');
              for (const parent of open) {
                if (parent.pull_request || parent.number === number || !parent.body) continue;
                const body = parent.body.replace(line, '$1[x]');
                if (body === parent.body) continue;
                await github.rest.issues.update({ owner, repo, issue_number: parent.number, body });
                parent.body = body;
                core.info(`Ticked #${number} in #${parent.number}.`);
              }
            }
