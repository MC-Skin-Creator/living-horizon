name: strip AI footers

# Some tools append "Generated by Claude Code", a session link or a co-author trailer to
# what they post on GitHub, and put it back when they edit it themselves. CLAUDE.md
# forbids them, so this removes them after each post. Edits made with GITHUB_TOKEN start
# no new run, so it never loops. Run it by hand to clean the whole repository.
#
# Pull request events run the copy on the pull request's base branch; issue and comment
# events, and the manual run, the copy on main.
on:
  pull_request_target:
    types: [opened, edited, reopened]
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created, edited]
  pull_request_review:
    types: [submitted, edited]
  pull_request_review_comment:
    types: [created, edited]
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: strip-ai-footers-${{ github.event.issue.number || github.event.pull_request.number || 'all' }}
  cancel-in-progress: false

jobs:
  strip:
    runs-on: ubuntu-latest

    steps:
      # The base branch's copy of the script, never the pull request's code.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref || github.ref }}
          sparse-checkout: .github/scripts

      - name: Strip the footers
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
        run: |
          if [ -n "$NUMBER" ]; then
            python3 .github/scripts/strip-ai-footers.py --repo "$GITHUB_REPOSITORY" --number "$NUMBER"
          else
            python3 .github/scripts/strip-ai-footers.py --repo "$GITHUB_REPOSITORY"
          fi
