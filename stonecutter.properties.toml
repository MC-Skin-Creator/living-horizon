# Mod identity at the top, then one table per Minecraft target.

mod.id = "livinghorizon"
mod.name = "Living Horizon"
mod.group = "fr.clixmods.livinghorizon"
mod.version = "0.3.2"

deps.fabric_loader = "0.19.3"
# What fabric.mod.json asks of players. Fabric API sets the real floor on each game
# version - 0.17.3 on 1.21.11 - and nothing this mod uses is newer than 0.15.11.
mod.loader_min = "0.15.11"

# The lowest Quilt Loader the Quilt jars are built and declared against: 0.30 is the
# first that treats every game version after 25 as unobfuscated, which the 26.x
# targets need.
deps.quilt_loader = "0.30.1"

# One JUnit line for every target, through the BOM.
deps.junit = "5.14.4"

# MixinExtras for the Forge targets that do not ship it (before 1.21.10), carried in the
# jar; the version newer Forge bundles.
deps.mixinextras = "0.5.3"

# The 1.17 line serves the obfuscated (pre-26) Loom variant on a Java 21 JVM.
loomx.loom_version = "1.17-SNAPSHOT"

